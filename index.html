<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarefas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sheet">
  <header>
    <div class="eyebrow-row">
      <span id="today-date"></span>
      <span id="count-pill"></span>
    </div>
    <h1>Suas <span class="accent">tarefas</span></h1>
  </header>

  <div class="composer">
    <div class="composer-row">
      <input type="text" id="new-task" placeholder="O que precisa ser feito?" autocomplete="off" maxlength="200">
      <div class="priority-select" role="group" aria-label="Prioridade">
        <button class="dot-btn active" data-p="media" title="Prioridade média" aria-label="Prioridade média"><span class="dot"></span></button>
        <button class="dot-btn" data-p="alta" title="Prioridade alta" aria-label="Prioridade alta"><span class="dot"></span></button>
        <button class="dot-btn" data-p="baixa" title="Prioridade baixa" aria-label="Prioridade baixa"><span class="dot"></span></button>
      </div>
      <button id="add-btn">Adicionar</button>
    </div>
  </div>

  <div class="filters" role="group" aria-label="Filtros">
    <button class="filter-btn active" data-filter="todas">Todas</button>
    <button class="filter-btn" data-filter="pendentes">Pendentes</button>
    <button class="filter-btn" data-filter="concluidas">Concluídas</button>
  </div>

  <main>
    <ul id="list"></ul>
    <div class="empty-state" id="empty-state" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <p id="empty-msg">Nada por aqui ainda.</p>
    </div>
  </main>

  <footer>
    <span id="left-label">0 tarefas pendentes</span>
    <button id="clear-done">Limpar concluídas</button>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
